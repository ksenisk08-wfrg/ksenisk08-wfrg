<svg xmlns="http://www.w3.org/2000/svg" width="800" height="90" viewBox="0 0 800 90">
  <line x1="0" y1="82" x2="800" y2="82" stroke="#ff9a9e" stroke-width="2" stroke-dasharray="6 8" opacity="0.5"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-90,0;800,0" dur="9s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="0.3s" repeatCount="indefinite"/>
      <!-- хвост -->
      <path d="M10 46 Q-8 40 -4 22" stroke="#a18cd1" stroke-width="5" fill="none" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-12 10 46;14 10 46;-12 10 46" dur="0.6s" repeatCount="indefinite"/>
      </path>
      <!-- лапы -->
      <line x1="14" y1="58" x2="14" y2="78" stroke="#8a74bd" stroke-width="6" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-28 14 58;28 14 58;-28 14 58" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="48" y1="58" x2="48" y2="78" stroke="#8a74bd" stroke-width="6" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="28 48 58;-28 48 58;28 48 58" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <!-- тело -->
      <ellipse cx="34" cy="50" rx="27" ry="14" fill="#a18cd1"/>
      <!-- дальние лапы -->
      <line x1="24" y1="58" x2="24" y2="78" stroke="#a18cd1" stroke-width="6" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="28 24 58;-28 24 58;28 24 58" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="58" y1="58" x2="58" y2="78" stroke="#a18cd1" stroke-width="6" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-28 58 58;28 58 58;-28 58 58" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <!-- голова -->
      <circle cx="66" cy="42" r="13" fill="#a18cd1"/>
      <polygon points="56,34 59,19 68,30" fill="#a18cd1"/>
      <polygon points="66,30 75,19 78,35" fill="#a18cd1"/>
      <polygon points="59,31 60,24 65,30" fill="#ff9a9e"/>
      <circle cx="71" cy="40" r="2" fill="#2b2b3a"/>
      <circle cx="77" cy="45" r="2" fill="#ff9a9e"/>
    </g>
  </g>
</svg>
